<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#6d5dfc" />
  <title>جلسة ألعاب</title>
  <style>
    :root {
      --bg: #f7f7ff;
      --surface: #ffffff;
      --surface-2: #f1efff;
      --text: #17162a;
      --muted: #6d6a82;
      --primary: #6d5dfc;
      --primary-2: #8a7cff;
      --accent: #ffb84d;
      --danger: #e5484d;
      --success: #2d9d78;
      --border: #e6e3f4;
      --shadow: 0 16px 40px rgba(45, 36, 100, .12);
      --radius: 22px;
    }
    [data-theme="dark"] {
      --bg: #11101a;
      --surface: #1a1826;
      --surface-2: #242038;
      --text: #f7f5ff;
      --muted: #b9b4ca;
      --primary: #8a7cff;
      --primary-2: #a99fff;
      --accent: #ffc66d;
      --danger: #ff6b70;
      --success: #56c89f;
      --border: #332f46;
      --shadow: 0 16px 40px rgba(0, 0, 0, .3);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 0%, rgba(109,93,252,.16), transparent 32%),
        radial-gradient(circle at 95% 10%, rgba(255,184,77,.16), transparent 26%),
        var(--bg);
      color: var(--text);
      font-family: Tahoma, Arial, sans-serif;
      line-height: 1.6;
      -webkit-tap-highlight-color: transparent;
    }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    .app { width: min(100%, 760px); margin: 0 auto; min-height: 100vh; padding: max(14px, env(safe-area-inset-top)) 14px max(24px, env(safe-area-inset-bottom)); }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 900; }
    .brand-badge { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 14px; background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: white; box-shadow: var(--shadow); font-size: 22px; }
    .top-actions { display: flex; gap: 8px; }
    .icon-btn { width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); color: var(--text); display: grid; place-items: center; box-shadow: 0 8px 20px rgba(45,36,100,.07); }
    .progress-wrap { overflow-x: auto; padding-bottom: 7px; scrollbar-width: none; margin-bottom: 12px; }
    .progress-wrap::-webkit-scrollbar { display: none; }
    .progress { display: flex; gap: 8px; min-width: max-content; }
    .step { display: flex; align-items: center; gap: 7px; padding: 8px 11px; border-radius: 999px; color: var(--muted); background: var(--surface); border: 1px solid var(--border); font-size: 13px; white-space: nowrap; }
    .step b { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; background: var(--surface-2); font-size: 12px; }
    .step.active { color: white; background: var(--primary); border-color: var(--primary); }
    .step.active b { color: var(--primary); background: white; }
    .step.done { color: var(--success); border-color: color-mix(in srgb, var(--success) 35%, var(--border)); }
    .screen { animation: enter .28s ease both; }
    @keyframes enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .hero { padding: 34px 4px 20px; text-align: center; }
    .hero-logo { width: 108px; height: 108px; display: grid; place-items: center; margin: 0 auto 20px; border-radius: 34px; background: linear-gradient(135deg, var(--primary), #a14eff); color: white; font-size: 52px; box-shadow: 0 22px 60px rgba(109,93,252,.32); transform: rotate(-4deg); }
    h1, h2, h3, p { margin-top: 0; }
    h1 { font-size: clamp(30px, 8vw, 48px); line-height: 1.16; margin-bottom: 10px; }
    h2 { font-size: clamp(25px, 6vw, 34px); line-height: 1.25; margin-bottom: 8px; }
    h3 { font-size: 20px; margin-bottom: 8px; }
    .lead { color: var(--muted); font-size: 17px; }
    .card { background: color-mix(in srgb, var(--surface) 96%, transparent); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); margin-bottom: 14px; }
    .soft-card { background: var(--surface-2); border-radius: 18px; padding: 15px; margin-bottom: 12px; }
    .actions { display: grid; gap: 10px; margin-top: 16px; }
    .actions.two { grid-template-columns: 1fr 1fr; }
    .btn { min-height: 52px; border: 0; border-radius: 17px; padding: 12px 16px; font-weight: 800; transition: transform .15s ease, filter .15s ease; display: inline-flex; justify-content: center; align-items: center; gap: 8px; text-decoration: none; }
    .btn:active { transform: scale(.98); }
    .btn.primary { background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: white; box-shadow: 0 12px 26px rgba(109,93,252,.24); }
    .btn.secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .btn.ghost { background: transparent; color: var(--primary); border: 1px dashed color-mix(in srgb, var(--primary) 45%, var(--border)); }
    .btn.danger { background: color-mix(in srgb, var(--danger) 12%, var(--surface)); color: var(--danger); border: 1px solid color-mix(in srgb, var(--danger) 30%, var(--border)); }
    .btn.small { min-height: 42px; border-radius: 14px; padding: 8px 12px; font-size: 14px; }
    .field { margin-bottom: 13px; }
    .field label { display: block; font-weight: 800; margin-bottom: 6px; }
    .input, textarea, select { width: 100%; border: 1px solid var(--border); border-radius: 15px; padding: 13px 14px; background: var(--surface); color: var(--text); outline: none; }
    .input:focus, textarea:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary) 14%, transparent); }
    textarea { min-height: 130px; resize: vertical; }
    .player-row { display: grid; grid-template-columns: 1fr 44px; gap: 9px; margin-bottom: 10px; }
    .delete-btn { border: 0; border-radius: 14px; color: var(--danger); background: color-mix(in srgb, var(--danger) 10%, var(--surface)); font-size: 18px; }
    .error { color: var(--danger); font-weight: 700; font-size: 14px; margin: 5px 2px 0; }
    .hint { color: var(--muted); font-size: 14px; }
    .notice { border-radius: 16px; padding: 12px 14px; background: color-mix(in srgb, var(--accent) 15%, var(--surface)); border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--border)); margin: 12px 0; }
    .counter { display: grid; grid-template-columns: 58px 1fr 58px; align-items: center; gap: 12px; margin: 18px 0; }
    .counter button { width: 58px; height: 58px; border-radius: 18px; border: 0; background: var(--surface-2); color: var(--primary); font-size: 28px; font-weight: 900; }
    .counter-value { text-align: center; font-size: 26px; font-weight: 900; }
    .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 15px; padding: 13px 0; border-bottom: 1px solid var(--border); }
    .switch-row:last-child { border-bottom: 0; }
    .switch { position: relative; width: 54px; height: 31px; flex: 0 0 auto; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; border-radius: 99px; background: #b7b3c5; transition: .2s; }
    .slider:before { content: ""; position: absolute; width: 23px; height: 23px; right: 4px; top: 4px; border-radius: 50%; background: white; transition: .2s; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
    .switch input:checked + .slider { background: var(--primary); }
    .switch input:checked + .slider:before { transform: translateX(-23px); }
    .segmented { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
    .segmented button { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 13px; padding: 10px 5px; font-weight: 800; }
    .segmented button.active { border-color: var(--primary); background: var(--primary); color: white; }
    .categories { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .category { position: relative; min-height: 112px; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 19px; padding: 15px; text-align: right; transition: .18s; }
    .category .emoji { display: block; font-size: 30px; margin-bottom: 8px; }
    .category.selected { border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 13%, transparent); background: color-mix(in srgb, var(--primary) 7%, var(--surface)); }
    .category.selected:after { content: "✓"; position: absolute; left: 10px; top: 10px; width: 25px; height: 25px; display: grid; place-items: center; border-radius: 50%; color: white; background: var(--primary); font-weight: 900; }
    .distribution-progress { height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin: 12px 0 20px; }
    .distribution-progress span { display: block; height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent)); border-radius: inherit; transition: width .3s; }
    .pass-card { text-align: center; padding: 28px 18px; }
    .person-orb { width: 98px; height: 98px; margin: 0 auto 18px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-size: 43px; border: 4px solid color-mix(in srgb, var(--primary) 18%, var(--surface)); }
    .role-card { text-align: center; padding: 26px 18px; overflow: hidden; position: relative; }
    .role-card.normal { background: linear-gradient(145deg, color-mix(in srgb, var(--success) 13%, var(--surface)), var(--surface)); }
    .role-card.imposter { background: linear-gradient(145deg, color-mix(in srgb, var(--danger) 13%, var(--surface)), var(--surface)); }
    .secret-word { margin: 16px auto; padding: 17px; border-radius: 18px; background: var(--surface); border: 2px dashed var(--primary); font-size: 30px; font-weight: 900; word-break: break-word; }
    .matchup { text-align: center; padding: 26px 15px; }
    .matchup-line { font-size: clamp(29px, 8vw, 44px); font-weight: 900; line-height: 1.35; margin: 22px 0; }
    .versus { display: grid; grid-template-columns: 1fr 58px 1fr; align-items: center; gap: 8px; }
    .player-chip { padding: 16px 8px; border-radius: 18px; background: var(--surface-2); font-size: 18px; font-weight: 900; overflow-wrap: anywhere; }
    .vs { width: 58px; height: 58px; display: grid; place-items: center; border-radius: 50%; background: var(--primary); color: white; font-weight: 900; }
    .timer { width: 94px; height: 94px; margin: 16px auto; display: grid; place-items: center; border-radius: 50%; border: 7px solid color-mix(in srgb, var(--primary) 25%, var(--border)); font-size: 28px; font-weight: 900; }
    .timer.ending { border-color: var(--danger); color: var(--danger); animation: pulse .7s infinite alternate; }
    @keyframes pulse { to { transform: scale(1.05); } }
    .tips ul { margin: 0; padding-right: 20px; }
    .tips li { margin: 6px 0; }
    .vote-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .vote-option { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 17px; min-height: 72px; padding: 12px; font-weight: 900; }
    .vote-option.selected { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 10%, var(--surface)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 12%, transparent); }
    .reveal { text-align: center; padding: 26px 15px; }
    .truth { font-size: 36px; font-weight: 900; margin: 18px 0; }
    .result-banner { text-align: center; border-radius: 24px; padding: 24px 16px; margin-bottom: 15px; background: linear-gradient(135deg, var(--primary), #a14eff); color: white; box-shadow: 0 18px 42px rgba(109,93,252,.28); }
    .result-banner.win-imposter { background: linear-gradient(135deg, #d83f55, #7b2cbf); }
    .result-banner.chaos { background: linear-gradient(135deg, #ff9f1c, #f15bb5); }
    .score-table { width: 100%; border-collapse: collapse; }
    .score-table th, .score-table td { padding: 11px 8px; text-align: right; border-bottom: 1px solid var(--border); }
    .score-table tr:last-child td { border-bottom: 0; }
    .badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 99px; font-size: 12px; font-weight: 900; background: var(--surface-2); }
    .badge.imposter { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, var(--surface)); }
    .badge.normal { color: var(--success); background: color-mix(in srgb, var(--success) 12%, var(--surface)); }
    .back-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
    .back { border: 0; background: transparent; color: var(--primary); font-weight: 900; padding: 8px; }
    .toast { position: fixed; right: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translate(50%, 18px); background: #1c1b24; color: white; padding: 11px 16px; border-radius: 14px; box-shadow: var(--shadow); z-index: 100; opacity: 0; pointer-events: none; transition: .25s; max-width: calc(100% - 28px); text-align: center; }
    .toast.show { opacity: 1; transform: translate(50%, 0); }
    .modal-backdrop { position: fixed; inset: 0; z-index: 80; background: rgba(12,10,24,.58); display: grid; place-items: end center; padding: 14px; animation: fade .2s; }
    @media (min-width: 650px) { .modal-backdrop { place-items: center; } }
    @keyframes fade { from { opacity: 0; } }
    .modal { width: min(100%, 520px); max-height: 88vh; overflow: auto; background: var(--surface); border-radius: 25px; padding: 20px; box-shadow: 0 30px 90px rgba(0,0,0,.35); animation: up .22s; }
    @keyframes up { from { transform: translateY(20px); opacity: 0; } }
    .privacy-shield { position: fixed; inset: 0; z-index: 120; background: var(--bg); display: grid; place-items: center; padding: 24px; text-align: center; }
    .privacy-icon { font-size: 58px; }
    .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 60; }
    .confetti i { position: absolute; top: -20px; width: 10px; height: 18px; border-radius: 3px; animation: fall var(--d) linear forwards; transform: rotate(var(--r)); background: hsl(var(--h) 80% 58%); }
    @keyframes fall { to { transform: translate3d(var(--x), 110vh, 0) rotate(760deg); } }
    .footer-note { text-align: center; color: var(--muted); font-size: 12px; margin-top: 22px; }

    .game-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
    .game-tile { position: relative; overflow: hidden; min-height: 205px; border: 1px solid var(--border); border-radius: 24px; padding: 20px; background: var(--surface); color: var(--text); text-align: right; box-shadow: var(--shadow); transition: transform .18s ease, border-color .18s ease; }
    .game-tile:active { transform: scale(.985); }
    .game-tile:hover { border-color: color-mix(in srgb, var(--primary) 55%, var(--border)); }
    .game-tile:before { content: ""; position: absolute; width: 145px; height: 145px; border-radius: 50%; left: -55px; bottom: -70px; background: color-mix(in srgb, var(--primary) 12%, transparent); }
    .game-tile.forbidden:before { background: color-mix(in srgb, var(--accent) 20%, transparent); }
    .game-icon { width: 62px; height: 62px; display: grid; place-items: center; border-radius: 20px; margin-bottom: 18px; font-size: 32px; background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: white; }
    .game-tile.forbidden .game-icon { background: linear-gradient(135deg, #ff9f1c, #f15bb5); }
    .game-tile h3 { font-size: 23px; margin-bottom: 6px; }
    .game-tile p { color: var(--muted); margin-bottom: 0; }
    .game-status { position: absolute; left: 14px; top: 14px; z-index: 2; }
    .mini-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
    .mini-stat { text-align: center; border: 1px solid var(--border); border-radius: 16px; padding: 10px 6px; background: var(--surface); }
    .mini-stat strong { display: block; font-size: 22px; line-height: 1.2; }
    .forbidden-hero .hero-logo { background: linear-gradient(135deg, #ff9f1c, #f15bb5); box-shadow: 0 22px 60px rgba(241,91,181,.24); }
    .forbidden-card { position: relative; overflow: hidden; text-align: center; padding: 22px 18px; animation: cardSwap .24s ease both; }
    @keyframes cardSwap { from { opacity: 0; transform: translateY(9px) scale(.985); } to { opacity: 1; transform: none; } }
    .forbidden-word { margin: 10px auto 18px; padding: 15px 10px; border-radius: 18px; background: linear-gradient(135deg, color-mix(in srgb, var(--primary) 10%, var(--surface)), var(--surface)); border: 2px dashed var(--primary); font-size: clamp(34px, 10vw, 52px); line-height: 1.25; font-weight: 900; overflow-wrap: anywhere; }
    .forbidden-label { color: var(--danger); font-weight: 900; margin-bottom: 9px; }
    .forbidden-words { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
    .forbidden-words span { min-height: 48px; display: grid; place-items: center; padding: 8px; border-radius: 14px; background: color-mix(in srgb, var(--danger) 9%, var(--surface)); color: var(--danger); border: 1px solid color-mix(in srgb, var(--danger) 22%, var(--border)); font-weight: 900; overflow-wrap: anywhere; }
    .forbidden-words span:last-child:nth-child(odd) { grid-column: 1 / -1; }
    .forbidden-hidden { min-height: 152px; display: grid; place-items: center; border-radius: 17px; background: var(--surface-2); color: var(--muted); padding: 18px; }
    .forbidden-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn.success { background: color-mix(in srgb, var(--success) 14%, var(--surface)); color: var(--success); border: 1px solid color-mix(in srgb, var(--success) 34%, var(--border)); }
    .timer-wide { width: 108px; height: 108px; margin: 0 auto; }
    .team-score-list { display: grid; gap: 8px; }
    .team-score-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 13px; border-radius: 15px; background: var(--surface-2); }
    .team-score-row.active { outline: 2px solid var(--primary); background: color-mix(in srgb, var(--primary) 9%, var(--surface)); }
    .round-note { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); font-size: 13px; font-weight: 800; }
    @media (max-width: 560px) { .game-grid { grid-template-columns: 1fr; } }
    @media (max-width: 390px) { .forbidden-controls { grid-template-columns: 1fr; } }

    /* تحسينات الواجهة العامة */
    .app { width: min(100%, 920px); padding-inline: clamp(12px, 3vw, 24px); }
    .topbar { position: sticky; top: max(8px, env(safe-area-inset-top)); z-index: 30; padding: 9px 10px; border: 1px solid color-mix(in srgb, var(--border) 82%, transparent); border-radius: 18px; background: color-mix(in srgb, var(--surface) 86%, transparent); backdrop-filter: blur(16px); box-shadow: 0 10px 28px rgba(45,36,100,.08); }
    .screen { width: min(100%, 820px); margin-inline: auto; }
    .landing-hero { display: grid; grid-template-columns: 116px 1fr; align-items: center; gap: 22px; padding: clamp(22px, 5vw, 34px); margin-bottom: 16px; border: 1px solid var(--border); border-radius: 28px; background: linear-gradient(145deg, color-mix(in srgb, var(--surface) 96%, transparent), color-mix(in srgb, var(--surface-2) 75%, transparent)); box-shadow: var(--shadow); overflow: hidden; position: relative; }
    .landing-hero:after { content:""; position:absolute; width:190px; height:190px; border-radius:50%; left:-80px; bottom:-120px; background:color-mix(in srgb, var(--accent) 18%, transparent); }
    .landing-hero .hero-logo { width: 106px; height: 106px; margin: 0; position: relative; z-index: 1; }
    .landing-hero-copy { position: relative; z-index: 1; }
    .landing-hero h1 { margin-bottom: 8px; }
    .landing-hero p { margin-bottom: 0; }
    .landing-hero.forbidden .hero-logo { background: linear-gradient(135deg, #ff9f1c, #f15bb5); box-shadow: 0 22px 60px rgba(241,91,181,.24); }
    .game-grid { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
    .game-tile { min-height: 220px; padding: 22px; display: flex; flex-direction: column; justify-content: flex-end; isolation: isolate; }
    .game-tile .game-icon { position: absolute; right: 20px; top: 20px; }
    .game-tile h3, .game-tile p { position: relative; z-index: 2; }
    .game-tile h3 { margin-top: 86px; }
    .card { padding: clamp(17px, 3vw, 23px); }
    .setup-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 14px; align-items: start; }
    .setup-grid > .card { margin-bottom: 0; height: 100%; }
    .section-label { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 13px; }
    .section-label h3 { margin: 0; }
    .stage-kicker { display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px; border-radius: 999px; background: var(--surface-2); color: var(--muted); font-size: 13px; font-weight: 900; }

    /* صفحة إعدادات الكلمة الممنوعة */
    .forbidden-setup-hero { position:relative; overflow:hidden; display:grid; grid-template-columns:minmax(0,1.35fr) minmax(230px,.65fr); gap:18px; align-items:stretch; margin-bottom:14px; padding:clamp(20px,4vw,32px); border:1px solid var(--border); border-radius:30px; background:linear-gradient(145deg,color-mix(in srgb,var(--surface) 96%,transparent),color-mix(in srgb,#ff9f1c 9%,var(--surface))); box-shadow:var(--shadow); }
    .forbidden-setup-hero:before { content:""; position:absolute; width:260px; height:260px; border-radius:50%; left:-110px; bottom:-165px; background:color-mix(in srgb,#f15bb5 20%,transparent); pointer-events:none; }
    .forbidden-setup-copy, .forbidden-hero-side { position:relative; z-index:1; }
    .forbidden-setup-copy h1 { margin:10px 0 8px; font-size:clamp(30px,6vw,48px); }
    .forbidden-setup-copy p { max-width:620px; margin:0; }
    .forbidden-overview { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-top:20px; }
    .forbidden-overview > div { min-height:72px; display:grid; place-items:center; text-align:center; padding:9px; border:1px solid color-mix(in srgb,var(--border) 78%,transparent); border-radius:17px; background:color-mix(in srgb,var(--surface) 80%,transparent); backdrop-filter:blur(10px); }
    .forbidden-overview strong { display:block; font-size:21px; line-height:1.1; }
    .forbidden-overview span { color:var(--muted); font-size:12px; font-weight:800; }
    .forbidden-hero-side { display:grid; place-items:center; min-height:220px; border-radius:24px; background:linear-gradient(145deg,#ff9f1c,#f15bb5); color:white; box-shadow:0 18px 42px rgba(241,91,181,.22); }
    .forbidden-hero-side .hero-symbol { font-size:74px; line-height:1; filter:drop-shadow(0 10px 20px rgba(0,0,0,.16)); }
    .forbidden-best { text-align:center; }
    .forbidden-best span { display:block; opacity:.82; font-size:13px; font-weight:800; }
    .forbidden-best strong { display:block; font-size:38px; line-height:1.1; }
    .forbidden-setup-grid { display:grid; grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr); gap:14px; align-items:start; }
    .forbidden-setup-grid > .card { margin-bottom:0; }
    .rule-steps { display:grid; gap:9px; }
    .rule-step { display:grid; grid-template-columns:42px 1fr; gap:11px; align-items:center; padding:12px; border-radius:17px; background:var(--surface-2); }
    .rule-step b { width:42px; height:42px; display:grid; place-items:center; border-radius:14px; color:white; background:linear-gradient(135deg,#ff9f1c,#f15bb5); font-size:17px; }
    .rule-step p { margin:0; color:var(--muted); font-size:14px; }
    .setup-section + .setup-section { margin-top:20px; padding-top:18px; border-top:1px solid var(--border); }
    .setup-title { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:11px; }
    .setup-title h3 { margin:0; }
    .setup-title .badge { flex:0 0 auto; }
    .mode-cards { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; }
    .mode-card { min-height:92px; border:1px solid var(--border); border-radius:18px; background:var(--surface); color:var(--text); padding:13px; text-align:right; transition:.16s; }
    .mode-card span { display:block; font-size:26px; margin-bottom:4px; }
    .mode-card b { display:block; }
    .mode-card small { color:var(--muted); }
    .mode-card.active { border-color:#f15bb5; background:color-mix(in srgb,#f15bb5 8%,var(--surface)); box-shadow:0 0 0 3px color-mix(in srgb,#f15bb5 12%,transparent); }
    .team-name-fields { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; }
    .team-name-fields .field { margin:0; }
    .team-name-fields label { font-size:13px; color:var(--muted); }
    .audio-settings { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; }
    .audio-setting { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:82px; padding:13px; border:1px solid var(--border); border-radius:17px; background:var(--surface-2); }
    .audio-setting b { display:block; }
    .audio-setting .hint { line-height:1.4; }
    .start-panel { display:flex; align-items:center; justify-content:space-between; gap:14px; margin-top:14px; padding:12px; border:1px solid color-mix(in srgb,#f15bb5 34%,var(--border)); border-radius:22px; background:color-mix(in srgb,var(--surface) 90%,transparent); backdrop-filter:blur(16px); box-shadow:0 16px 38px rgba(45,36,100,.15); }
    .start-panel-copy { padding-inline:6px; }
    .start-panel-copy b { display:block; }
    .start-panel-copy span { color:var(--muted); font-size:13px; }
    .start-panel .btn { min-width:210px; background:linear-gradient(135deg,#ff9f1c,#f15bb5); }

    /* شاشة كشف الامبوستر */
    .reveal-stage { text-align: center; padding: clamp(22px, 5vw, 38px) clamp(16px, 4vw, 30px); overflow: hidden; position: relative; }
    .reveal-stage:before { content:""; position:absolute; inset:-40%; background:radial-gradient(circle, color-mix(in srgb, var(--primary) 17%, transparent), transparent 52%); animation:revealGlow 1.2s ease-in-out infinite alternate; pointer-events:none; }
    @keyframes revealGlow { to { transform:scale(1.08); opacity:.55; } }
    .reveal-stage > * { position:relative; z-index:1; }
    .roulette-current { min-height: 92px; display:grid; place-items:center; margin: 18px 0; padding: 14px; border-radius: 22px; background: var(--surface-2); border: 2px solid var(--border); font-size: clamp(28px, 8vw, 44px); font-weight: 900; transition: .12s; }
    .roulette-current.complete { color: white; background: linear-gradient(135deg, #d83f55, #7b2cbf); border-color: transparent; box-shadow: 0 18px 42px rgba(123,44,191,.28); }
    .roulette-names { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin: 16px 0; }
    .roulette-name { padding: 8px 12px; border:1px solid var(--border); border-radius:999px; background:var(--surface); color:var(--muted); font-weight:800; transition:.12s; }
    .roulette-name.active { color:white; background:var(--primary); border-color:var(--primary); transform:scale(1.06); }
    .roulette-name.actual { color:white; background:linear-gradient(135deg,#d83f55,#7b2cbf); border-color:transparent; box-shadow:0 8px 18px rgba(123,44,191,.24); }
    .vote-summary { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; margin-top:14px; }
    .vote-summary > div { padding:12px; border-radius:16px; background:var(--surface-2); }
    .vote-summary b { display:block; font-size:17px; margin-top:3px; }

    /* شبكة تخمين التسع كلمات */
    .guess-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:9px; margin:18px 0; }
    .guess-grid .vote-option { min-height:66px; padding:10px 7px; }

    /* تسليم دور الكلمة الممنوعة */
    .handoff-card { text-align:center; padding:clamp(24px,6vw,42px) 18px; }
    .handoff-arrow { font-size:54px; line-height:1; margin:8px 0 16px; animation:handoffMove .8s ease-in-out infinite alternate; }
    @keyframes handoffMove { to { transform:translateX(-10px); } }
    .score-ribbon { display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; margin:14px 0; }
    .score-ribbon span { padding:8px 12px; border-radius:999px; background:var(--surface-2); font-weight:900; }
    .score-ribbon span.active { color:white; background:var(--primary); }

    @media (max-width: 650px) {
      .forbidden-setup-hero { grid-template-columns:1fr; padding:19px; }
      .forbidden-hero-side { min-height:150px; grid-template-columns:auto 1fr; gap:18px; padding:18px; }
      .forbidden-hero-side .hero-symbol { font-size:58px; }
      .forbidden-setup-grid, .audio-settings { grid-template-columns:1fr; }
      .start-panel { display:grid; }
      .start-panel .btn { width:100%; min-width:0; }
      .landing-hero { grid-template-columns: 1fr; text-align:center; gap:14px; }
      .landing-hero .hero-logo { margin-inline:auto; width:92px; height:92px; }
      .game-grid, .setup-grid { grid-template-columns:1fr; }
      .game-tile { min-height:185px; }
      .vote-summary { grid-template-columns:1fr; }
    }
    @media (max-width: 430px) {
      .forbidden-overview { grid-template-columns:repeat(3,minmax(0,1fr)); }
      .forbidden-overview > div { min-height:64px; padding:7px 4px; }
      .forbidden-overview strong { font-size:18px; }
      .mode-cards, .team-name-fields { grid-template-columns:1fr; }
      .guess-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .guess-grid .vote-option:last-child:nth-child(odd) { grid-column:1/-1; }
      .topbar { top:max(5px,env(safe-area-inset-top)); }
    }

    .hidden { display: none !important; }
    @media (max-width: 390px) {
      .actions.two { grid-template-columns: 1fr; }
      .categories, .vote-grid { grid-template-columns: 1fr; }
      .segmented { grid-template-columns: repeat(2, 1fr); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main id="app" class="app" aria-live="polite"></main>
  <div id="toast" class="toast" role="status"></div>
  <div id="modal-root"></div>
  <div id="privacy-root"></div>
  <div id="confetti-root"></div>

  <script src="data/imposter-words.js"></script>
  <script src="data/forbidden-words.js"></script>

  <script>
    (() => {
      'use strict';

      const STORAGE_KEY = 'min_bra_alsalfa_state_v3';
      const SECRET_KEY = 'min_bra_alsalfa_secret_v3';
      const MAX_PLAYERS = 10;
      const MIN_PLAYERS = 2;

      const categories = Array.isArray(window.MAJLIS_GAME_DATA?.imposterCategories)
        ? window.MAJLIS_GAME_DATA.imposterCategories
        : [];
      const forbiddenCards = Array.isArray(window.MAJLIS_GAME_DATA?.forbiddenCards)
        ? window.MAJLIS_GAME_DATA.forbiddenCards
        : [];

      const makeId = () => `${Date.now().toString(36)}_${Math.random().toString(36).slice(2,8)}`;
      const clamp = (n, min, max) => Math.min(max, Math.max(min, n));
      const shuffle = (arr) => {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      };
      const sample = (arr) => arr[Math.floor(Math.random() * arr.length)];
      const escapeHtml = (value = '') => String(value).replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
      const normalizeName = (s) => String(s || '').trim().replace(/\s+/g, ' ');
      const normalizeArabic = (s) => String(s || '').trim().toLowerCase()
        .replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[ؤئ]/g,'ء')
        .replace(/[ًٌٍَُِّْـ]/g,'').replace(/\s+/g,' ');

      function defaultState() {
        return {
          screen: 'home',
          players: [
            { id: makeId(), name: 'اللاعب الاول', score: 0 },
            { id: makeId(), name: 'اللاعب الثاني', score: 0 }
          ],
          settings: {
            imposterCount: 1,
            allImposters: false,
            randomCategory: true,
            sound: true,
            vibration: true,
            theme: 'light',
            pointsEnabled: true,
            allowSelfVote: false,
            voteMode: 'one',
            questionTimer: 30,
            discussionMinutes: 2,
            imposterMusic: true
          },
          selectedCategoryIds: [],
          customCategories: [],
          previousWords: [],
          round: null,
          forbidden: {
            duration: 60,
            mode: 'players',
            teams: 2,
            tensionMusic: true,
            bestScore: 0,
            teamScores: [0,0,0,0],
            teamNames: ['فريق 1','فريق 2','فريق 3','فريق 4'],
            nextTeam: 1,
            round: null
          },
          privacyShield: false
        };
      }

      let state = loadState();
      let secret = loadSecret();
      let timerHandle = null;
      let timerRemaining = 0;
      let tensionHandle = null;
      let imposterMusicHandle = null;
      let revealHandle = null;
      let audioContext = null;
      let deferredInstallPrompt = null;

      function loadState() {
        try {
          const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (!parsed || !Array.isArray(parsed.players)) return defaultState();
          const base = defaultState();
          const restored = {
            ...base,
            ...parsed,
            settings: { ...base.settings, ...(parsed.settings || {}) },
            players: parsed.players.map(p => ({ id: p.id || makeId(), name: p.name || '', score: Number(p.score || 0) })),
            customCategories: Array.isArray(parsed.customCategories) ? parsed.customCategories : [],
            selectedCategoryIds: Array.isArray(parsed.selectedCategoryIds) ? parsed.selectedCategoryIds : [],
            previousWords: Array.isArray(parsed.previousWords) ? parsed.previousWords : [],
            forbidden: {
              ...base.forbidden,
              ...(parsed.forbidden || {}),
              teamScores: Array.isArray(parsed.forbidden?.teamScores) ? parsed.forbidden.teamScores.slice(0,4).concat([0,0,0,0]).slice(0,4).map(Number) : [...base.forbidden.teamScores],
              teamNames: Array.isArray(parsed.forbidden?.teamNames)
                ? parsed.forbidden.teamNames.slice(0,4).concat(base.forbidden.teamNames).slice(0,4).map((name,i) => normalizeName(name) || `فريق ${i+1}`)
                : [...base.forbidden.teamNames]
            }
          };
          if (restored.screen === 'roles' && restored.round?.roleRevealed) {
            restored.round.roleRevealed = false;
            restored.privacyShield = true;
          }
          if (restored.round) {
            restored.round.voteRestriction = null;
            restored.round.revoteContext = null;
            restored.round.tiePending = false;
            if (restored.screen === 'result' && !restored.round.resultWinner) restored.screen = 'vote-reveal';
          }
          return restored;
        } catch { return defaultState(); }
      }

      function encodeSecret(obj) {
        const raw = encodeURIComponent(JSON.stringify(obj));
        const key = 'salfa-2026';
        let out = '';
        for (let i = 0; i < raw.length; i++) out += String.fromCharCode(raw.charCodeAt(i) ^ key.charCodeAt(i % key.length));
        return btoa(out);
      }
      function decodeSecret(text) {
        const key = 'salfa-2026';
        const raw = atob(text);
        let out = '';
        for (let i = 0; i < raw.length; i++) out += String.fromCharCode(raw.charCodeAt(i) ^ key.charCodeAt(i % key.length));
        return JSON.parse(decodeURIComponent(out));
      }
      function saveSecret() {
        try { localStorage.setItem(SECRET_KEY, encodeSecret(secret || {})); } catch {}
      }
      function loadSecret() {
        try {
          const raw = localStorage.getItem(SECRET_KEY);
          return raw ? decodeSecret(raw) : {};
        } catch { return {}; }
      }
      function saveState() {
        try {
          const safe = { ...state, privacyShield: false };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(safe));
          saveSecret();
        } catch {}
      }
      function setState(patch, renderNow = true) {
        state = typeof patch === 'function' ? patch(state) : { ...state, ...patch };
        saveState();
        if (renderNow) render();
      }

      function feedback(kind = 'tap') {
        if (state.settings.vibration && navigator.vibrate) navigator.vibrate(kind === 'big' ? [30,25,35] : 18);
        if (!state.settings.sound) return;
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          const ctx = new AudioCtx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = kind === 'big' ? 'triangle' : 'sine';
          osc.frequency.value = kind === 'error' ? 180 : kind === 'big' ? 640 : 420;
          gain.gain.setValueAtTime(.0001, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(.08, ctx.currentTime + .01);
          gain.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + .11);
          osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + .12);
        } catch {}
      }


      function getAudioContext() {
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return null;
          if (!audioContext) audioContext = new AudioCtx();
          if (audioContext.state === 'suspended') audioContext.resume();
          return audioContext;
        } catch { return null; }
      }

      function playTone(frequency, duration = .12, type = 'sine', volume = .055, delay = 0) {
        if (!state.settings.sound) return;
        const ctx = getAudioContext();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const start = ctx.currentTime + delay;
        osc.type = type;
        osc.frequency.setValueAtTime(frequency, start);
        gain.gain.setValueAtTime(.0001, start);
        gain.gain.exponentialRampToValueAtTime(volume, start + .012);
        gain.gain.exponentialRampToValueAtTime(.0001, start + duration);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(start); osc.stop(start + duration + .02);
      }

      function playGameSound(kind) {
        if (!state.settings.sound) return;
        if (kind === 'correct') {
          playTone(523, .13, 'sine', .07, 0);
          playTone(659, .13, 'sine', .07, .08);
          playTone(784, .18, 'triangle', .075, .16);
        } else if (kind === 'skip') {
          playTone(310, .1, 'triangle', .045, 0);
          playTone(245, .14, 'triangle', .04, .07);
        } else if (kind === 'time') {
          playTone(220, .24, 'sawtooth', .065, 0);
          playTone(165, .3, 'sawtooth', .06, .22);
          playTone(110, .42, 'square', .045, .47);
        } else if (kind === 'tick') {
          playTone(880, .055, 'square', .022, 0);
        } else if (kind === 'start') {
          playTone(392, .12, 'triangle', .055, 0);
          playTone(523, .16, 'triangle', .06, .1);
        } else if (kind === 'vote') {
          playTone(220, .12, 'triangle', .04, 0);
          playTone(277, .14, 'triangle', .045, .09);
        } else if (kind === 'reveal') {
          playTone(196, .18, 'sawtooth', .05, 0);
          playTone(294, .18, 'triangle', .06, .12);
          playTone(392, .28, 'triangle', .075, .25);
        }
      }

      function stopImposterMusic() {
        if (imposterMusicHandle) clearInterval(imposterMusicHandle);
        imposterMusicHandle = null;
      }

      function startImposterMusic() {
        stopImposterMusic();
        if (!state.settings.sound || !state.settings.imposterMusic || !['questions','discussion','voting'].includes(state.screen)) return;
        let step = 0;
        const pulse = () => {
          if (!['questions','discussion','voting'].includes(state.screen)) return stopImposterMusic();
          let urgent = false;
          if (state.screen === 'questions' && state.settings.questionTimer) urgent = timerRemaining <= 7;
          if (state.screen === 'discussion') urgent = Number(state.round?.discussionRemaining || 0) <= 12;
          const notes = state.screen === 'voting'
            ? [130,155,174,196]
            : urgent ? [196,233,262,311] : [110,131,147,165];
          playTone(notes[step % notes.length], urgent ? .13 : .22, 'triangle', urgent ? .03 : .018);
          if (urgent && step % 2 === 0) playTone(notes[(step + 2) % notes.length] * 2, .06, 'square', .011, .05);
          step += 1;
        };
        pulse();
        imposterMusicHandle = setInterval(pulse, state.screen === 'voting' ? 760 : 880);
      }

      function stopRevealAnimation() {
        if (revealHandle) clearInterval(revealHandle);
        revealHandle = null;
      }

      function stopTensionSound() {
        if (tensionHandle) clearInterval(tensionHandle);
        tensionHandle = null;
      }

      function startTensionSound() {
        stopTensionSound();
        stopImposterMusic();
        stopRevealAnimation();
        if (!state.settings.sound || !state.forbidden.tensionMusic || state.screen !== 'forbidden-play') return;
        let step = 0;
        const pulse = () => {
          const r = state.forbidden.round;
          if (!r?.active || state.screen !== 'forbidden-play') return stopTensionSound();
          const remaining = Math.max(0, Math.ceil((r.endsAt - Date.now()) / 1000));
          const urgent = remaining <= 10;
          const notes = urgent ? [196,247,294,330] : [147,165,196,220];
          playTone(notes[step % notes.length], urgent ? .12 : .18, 'triangle', urgent ? .032 : .022, 0);
          if (urgent && remaining <= 5) playGameSound('tick');
          step++;
        };
        pulse();
        tensionHandle = setInterval(pulse, 700);
      }

      function toast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(toast._t);
        toast._t = setTimeout(() => el.classList.remove('show'), 2600);
      }

      function showModal({ title, body, confirmText = 'تمام', cancelText = 'الغاء', onConfirm, hideCancel = false }) {
        const root = document.getElementById('modal-root');
        root.innerHTML = `
          <div class="modal-backdrop" role="dialog" aria-modal="true" aria-label="${escapeHtml(title)}">
            <div class="modal">
              <h3>${escapeHtml(title)}</h3>
              <div>${body}</div>
              <div class="actions two">
                ${hideCancel ? '' : `<button class="btn secondary" data-modal-cancel>${escapeHtml(cancelText)}</button>`}
                <button class="btn primary" data-modal-confirm>${escapeHtml(confirmText)}</button>
              </div>
            </div>
          </div>`;
        root.querySelector('[data-modal-cancel]')?.addEventListener('click', () => root.innerHTML = '');
        root.querySelector('[data-modal-confirm]')?.addEventListener('click', () => {
          const shouldClose = onConfirm ? onConfirm(root) : true;
          if (shouldClose !== false) root.innerHTML = '';
        });
      }

      function allCategories() { return [...categories, ...state.customCategories]; }
      function getCategory(id) { return allCategories().find(c => c.id === id); }
      function currentPlayerById(id) { return state.players.find(p => p.id === id); }
      function maxImposters() { return Math.max(1, Math.min(3, state.players.length - 1)); }
      function validPlayers() {
        const names = state.players.map(p => normalizeName(p.name));
        const lowered = names.map(n => n.toLocaleLowerCase('ar'));
        return state.players.length >= MIN_PLAYERS && state.players.length <= MAX_PLAYERS && names.every(Boolean) && new Set(lowered).size === names.length;
      }
      function playerErrors() {
        const names = state.players.map(p => normalizeName(p.name));
        if (names.some(n => !n)) return 'فيه اسم فاضي، عبوه وبعدين كملوا.';
        if (new Set(names.map(n => n.toLocaleLowerCase('ar'))).size !== names.length) return 'فيه اسم مكرر، غيروه عشان ما نلخبط.';
        return '';
      }

      const steps = [
        ['players','اللاعبون'], ['settings','الاعدادات'], ['categories','التصنيف'], ['roles','توزيع الادوار'],
        ['questions','الاسئلة'], ['voting','التصويت'], ['result','النتيجة']
      ];
      function screenStep(screen) {
        if (['home','imposter-home','forbidden-home','forbidden-pass','forbidden-play','forbidden-handoff','forbidden-result'].includes(screen)) return -1;
        if (['players'].includes(screen)) return 0;
        if (['settings'].includes(screen)) return 1;
        if (['categories'].includes(screen)) return 2;
        if (['roles'].includes(screen)) return 3;
        if (['questions','discussion'].includes(screen)) return 4;
        if (['voting','vote-reveal','guess'].includes(screen)) return 5;
        if (['result'].includes(screen)) return 6;
        return 0;
      }
      function progressHtml() {
        const current = screenStep(state.screen);
        if (current < 0) return '';
        return `<div class="progress-wrap" aria-label="مراحل اللعبة"><div class="progress">${steps.map((s,i) => `<div class="step ${i === current ? 'active' : i < current ? 'done' : ''}"><b>${i+1}</b>${s[1]}</div>`).join('')}</div></div>`;
      }
      function topbarHtml() {
        const forbiddenScreen = state.screen.startsWith('forbidden-');
        const meta = state.screen === 'home'
          ? { icon:'🎲', name:'جلسة ألعاب' }

      function startRound() {

        if (!wordPool.length) wordPool = pickedCategory.words;
        const pickedWord = sample(wordPool);
        const order = shuffle(state.players.map(p => p.id));
        const imposterIds = state.settings.allImposters ? [...order] : shuffle(order).slice(0, clamp(state.settings.imposterCount,1,maxImposters()));
        secret = { word: pickedWord, imposterIds };
        state.previousWords = [...state.previousWords, pickedWord].slice(-20);

          started: true,
          categoryId: pickedCategory.id,
          categoryName: pickedCategory.name,

          roleRevealed: false,

          pairings: [],
          usedPairs: [],
          questionIndex: 0,
          questionRound: 1,

      function generateFairPairings(roundNumber = 1) {
        const ids = state.players.map(p => p.id);
        if (ids.length === 2) return [{asker:ids[0],target:ids[1]},{asker:ids[1],target:ids[0]}];
        const used = new Set(state.round.usedPairs || []);
        let best = null;
        let bestScore = Infinity;
        for (let attempt = 0; attempt < 500; attempt++) {
          const askers = shuffle(ids);
          const shift = 1 + Math.floor(Math.random() * (ids.length - 1));
          const baseTargets = askers.map((_,i) => askers[(i + shift) % askers.length]);
          const pairs = askers.map((asker,i) => ({ asker, target: baseTargets[i] }));
          if (pairs.some(p => p.asker === p.target)) continue;
          let score = 0;
          pairs.forEach(p => { if (used.has(`${p.asker}>${p.target}`)) score += 8; });
          for (let i=1;i<pairs.length;i++) {
            const a = pairs[i-1], b = pairs[i];
            if (a.asker === b.asker || a.asker === b.target || a.target === b.asker || a.target === b.target) score += 1;
          }
          score += Math.random();
          if (score < bestScore) { best = pairs; bestScore = score; }
        }
        return best || ids.map((id,i) => ({ asker:id, target:ids[(i+1)%ids.length] }));
      }

      function beginQuestions(extra = false) {

        state.round.questionRound = extra ? state.round.questionRound + 1 : 1;
        state.screen = 'questions';

          </div>

      function startQuestionTimer() {
        const seconds = Number(state.settings.questionTimer || 0);
        if (!seconds) return;
        timerRemaining = seconds;
        const el = document.getElementById('timer');
        if (!el) return;
        el.textContent = timerRemaining;
        timerHandle = setInterval(() => {
          timerRemaining--;
          const current = document.getElementById('timer');
          if (!current) return stopTimer();
          current.textContent = Math.max(0,timerRemaining);
          current.classList.toggle('ending', timerRemaining <= 5);
          if (timerRemaining <= 0) { stopTimer(); feedback('big'); toast('خلص الوقت، يلا على السؤال اللي بعده'); }
        },1000);
      }
      function stopTimer() { if (timerHandle) clearInterval(timerHandle); timerHandle = null; }

      function skipCurrentMatch() {
        const r = state.round;
        const i = r.questionIndex;
        const current = r.pairings[i];
        let swapped = false;
        for (let j = i + 1; j < r.pairings.length; j++) {
          const other = r.pairings[j];
          const aTarget = other.target;
          const bTarget = current.target;
          if (current.asker !== aTarget && other.asker !== bTarget) {
            const newA = `${current.asker}>${aTarget}`;
            const newB = `${other.asker}>${bTarget}`;
            if (!r.usedPairs.includes(newA) && !r.usedPairs.includes(newB)) {
              current.target = aTarget;
              other.target = bTarget;
              swapped = true;
              break;
            }
          }
        }
        if (!swapped) toast('ما لقينا تبديل عادل، خلوا هالمواجهة تمشي');
        else { feedback(); saveState(); render(); }
      }

      function startDiscussion() {
        state.round.discussionRemaining = state.settings.discussionMinutes * 60;
        state.round.discussionRunning = true;
        state.screen = 'discussion';
        saveState(); render();
      }
      function renderDiscussion() {
        const s = state.round.discussionRemaining || 0;
        const m = String(Math.floor(s/60)).padStart(2,'0');
        const sec = String(s%60).padStart(2,'0');
        return `${backRow('5 من 7','locked-back')}<div class="card pass-card"><div class="person-orb">🗣️</div><h2>وقت النقاش العام</h2><p class="lead">الحين كل واحد يدافع عن نفسه ويشكك بالثاني.</p><div id="discussion-timer" class="timer">${m}:${sec}</div><div class="actions two"><button class="btn secondary" data-action="toggle-discussion">${state.round.discussionRunning ? 'وقف المؤقت' : 'كمل المؤقت'}</button><button class="btn primary" data-action="go-voting">ابدأ التصويت</button></div></div>`;
      }
      function startDiscussionTimer() {
        timerHandle = setInterval(() => {
          if (!state.round?.discussionRunning) return;
          state.round.discussionRemaining = Math.max(0, state.round.discussionRemaining - 1);
          const el = document.getElementById('discussion-timer');
          if (el) {
            const s = state.round.discussionRemaining;
            el.textContent = `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
            el.classList.toggle('ending', s <= 10);
          }
          if (state.round.discussionRemaining % 5 === 0) saveState();
          if (state.round.discussionRemaining <= 0) {
            state.round.discussionRunning = false; stopTimer(); feedback('big'); toast('خلص وقت النقاش، يلا تصويت'); saveState();
          }
        },1000);
      }

      function voteChoicesFor(voterId) {
        return state.players.map(p => p.id).filter(id => state.settings.allowSelfVote || id !== voterId);
      }
      function neededVoteCount(voterId) {
        const choices = voteChoicesFor(voterId).length;
        if (state.settings.allImposters) return 1;
        return state.settings.voteMode === 'all' ? Math.min(secret.imposterIds.length, choices) : 1;
      }
      function goVoting() {
        state.round.votes = {};
        state.round.voterOrder = shuffle(state.players.map(p => p.id));
        state.round.voterIndex = 0;
        state.round.voteStarted = false;
        state.round.currentVote = [];
        state.round.tieCandidates = [];
        state.round.voteRestriction = null;
        state.round.revoteContext = null;
        state.round.tiePending = false;
        state.screen = 'voting';
        saveState(); render();
      }
      function renderVoting() {
        const r = state.round;
        if (!r) return '';
        const voterId = r.voterOrder[r.voterIndex];
        const voter = currentPlayerById(voterId);
        if (!voter) return `<div class="card"><button class="btn primary" data-action="finish-voting">اظهر النتيجة</button></div>`;
        if (!r.voteStarted) {
          return `${backRow('6 من 7','locked-back')}<div class="card pass-card"><div class="person-orb">🗳️</div><h2>عط الجوال لـ ${escapeHtml(voter.name)} عشان يصوت</h2><p class="lead">كل لاعب يصوّت بحرية، وما فيه إعادة تصويت حتى لو تساوت الأصوات.</p><button class="btn primary" style="width:100%" data-action="start-vote">ابدأ التصويت</button></div>`;
        }
        const needed = neededVoteCount(voterId);
        const choices = voteChoicesFor(voterId);
        return `${backRow('6 من 7','locked-back')}<div class="card"><h2>مين برا السالفة؟</h2><p class="lead">${escapeHtml(voter.name)}، اختر ${needed === 1 ? 'الشخص اللي تشك فيه' : `${needed} أشخاص تشك فيهم`}.</p>
          <div class="vote-grid">${choices.map(id => { const p=currentPlayerById(id); return `<button class="vote-option ${r.currentVote.includes(id) ? 'selected' : ''}" data-vote-option="${id}">${escapeHtml(p.name)}</button>`; }).join('')}</div>
          <div class="notice" style="margin-top:12px">إذا تساوت الأصوات بنكمل مباشرة للكشف، بدون جولة تصويت ثانية.</div>
          <div class="hint">اخترت ${r.currentVote.length} من ${needed}</div>
          <button class="btn primary" style="width:100%;margin-top:14px" data-action="confirm-vote" ${r.currentVote.length === needed ? '' : 'disabled'}>تأكيد وإخفاء التصويت</button></div>`;
      }

      function calculateTally() {
        const tally = Object.fromEntries(state.players.map(p => [p.id,0]));
        Object.values(state.round.votes).forEach(arr => arr.forEach(id => { tally[id] = (tally[id] || 0) + 1; }));
        state.round.finalTally = tally;

        const totalSlots = state.settings.allImposters ? 1 : secret.imposterIds.length;
        const order = new Map(state.players.map((p,index) => [p.id,index]));
        const sorted = state.players
          .map(p => [p.id, tally[p.id] || 0])
          .sort((a,b) => (b[1] - a[1]) || ((order.get(a[0]) || 0) - (order.get(b[0]) || 0)));
        const cutoff = sorted[Math.min(totalSlots - 1, sorted.length - 1)]?.[1] ?? 0;
        const aboveCutoff = sorted.filter(([,votes]) => votes > cutoff).length;
        const atCutoff = sorted.filter(([,votes]) => votes === cutoff).map(([id]) => id);
        const boundarySlots = Math.max(0, totalSlots - aboveCutoff);
        const hasBoundaryTie = atCutoff.length > boundarySlots;

        state.round.topSuspects = sorted.slice(0,totalSlots).map(([id]) => id);
        state.round.tieCandidates = hasBoundaryTie ? atCutoff : [];
        state.round.detected = !state.settings.allImposters
          && secret.imposterIds.every(id => state.round.topSuspects.includes(id))
          && !hasBoundaryTie;
        state.round.voteRestriction = null;
        state.round.revoteContext = null;
        state.round.tiePending = false;
      }

      function prepareGuessOptions() {
        const r = state.round;
        const category = getCategory(r.categoryId);
        const sameCategory = (category?.words || []).filter(w => normalizeArabic(w) !== normalizeArabic(secret.word));
        const extraPool = allCategories().flatMap(c => c.words || []).filter(w => normalizeArabic(w) !== normalizeArabic(secret.word));
        const pool = [...new Set([...sameCategory, ...extraPool])];
        r.guessOptions = r.guessOptions || {};
        (secret.imposterIds || []).forEach(id => {
          if (!Array.isArray(r.guessOptions[id]) || r.guessOptions[id].length !== 9) {
            r.guessOptions[id] = shuffle([secret.word, ...shuffle(pool).slice(0,8)]);
          }
        });
      }

      function finishVoting() {
        calculateTally();
        if (state.settings.allImposters) return finalizeResult();
        state.round.guessIndex = 0;
        state.round.guesses = {};
        state.round.guessedCorrectly = false;
        state.round.revealComplete = false;
        state.round.revealDisplayId = null;
        state.round.guessOptions = {};
        prepareGuessOptions();
        state.screen = 'vote-reveal';
        playGameSound('vote');
        saveState(); render();
      }

      function renderVoteReveal() {
        const r = state.round;
        if (!r) return '';
        const actualIds = secret.imposterIds || [];
        const votedNames = (r.topSuspects || []).map(id => currentPlayerById(id)?.name).filter(Boolean);
        const actualNames = actualIds.map(id => currentPlayerById(id)?.name).filter(Boolean);
        const displayPlayer = currentPlayerById(r.revealDisplayId) || state.players[0];
        const currentText = r.revealComplete ? actualNames.join('، ') : (displayPlayer?.name || '...');
        return `${backRow('كشف الامبوستر','locked-back')}<div class="card reveal-stage">
          <span class="stage-kicker">🎭 لحظة الكشف</span>
          <h2 style="margin-top:14px">${r.revealComplete ? 'الامبوستر الحقيقي هو' : 'مين كان برا السالفة؟'}</h2>
          <p class="lead">${r.revealComplete ? 'هذا هو الدور الحقيقي مهما كانت نتيجة التصويت.' : 'الأسماء بتتحرك بسرعة... ركزوا!'}</p>
          <div id="roulette-current" class="roulette-current ${r.revealComplete ? 'complete' : ''}">${escapeHtml(currentText)}</div>
          <div class="roulette-names">${state.players.map(p => `<span class="roulette-name ${!r.revealComplete && p.id === r.revealDisplayId ? 'active' : ''} ${r.revealComplete && actualIds.includes(p.id) ? 'actual' : ''}" data-reveal-name="${p.id}">${escapeHtml(p.name)}</span>`).join('')}</div>
          ${r.revealComplete ? `<div class="vote-summary"><div><span class="hint">تصويتكم راح على</span><b>${escapeHtml(votedNames.join('، ') || 'ما فيه اختيار محسوم')}</b></div><div><span class="hint">الامبوستر الحقيقي</span><b>${escapeHtml(actualNames.join('، '))}</b></div></div><button class="btn primary" style="width:100%;margin-top:18px" data-action="continue-to-guess">عطوا الجوال للامبوستر وخلوه يختار</button>` : '<div class="notice">بيظهر الاسم الحقيقي بعد لحظات.</div>'}
        </div>`;
      }

      function startVoteRevealAnimation() {
        stopRevealAnimation();
        const r = state.round;
        if (!r || r.revealComplete || state.screen !== 'vote-reveal') return;
        const ids = state.players.map(p => p.id);
        if (!ids.length) return;
        const totalSteps = Math.max(24, ids.length * 6);
        let step = 0;
        revealHandle = setInterval(() => {
          if (state.screen !== 'vote-reveal' || !state.round) return stopRevealAnimation();
          const id = ids[(step * 3 + Math.floor(step / Math.max(1, ids.length))) % ids.length];
          r.revealDisplayId = id;
          const player = currentPlayerById(id);
          const current = document.getElementById('roulette-current');
          if (current) current.textContent = player?.name || '...';
          document.querySelectorAll('[data-reveal-name]').forEach(el => el.classList.toggle('active', el.dataset.revealName === id));
          playTone(220 + step * 8, .055, 'square', .018);
          step += 1;
          if (step >= totalSteps) {
            stopRevealAnimation();
            r.revealComplete = true;
            r.revealDisplayId = secret.imposterIds?.[0] || null;
            playGameSound('reveal');
            if (state.settings.vibration && navigator.vibrate) navigator.vibrate([45,25,60]);
            saveState(); render();
          }
        }, Math.max(70, 125 - Math.floor(state.players.length * 3)));
      }

      function renderGuess() {
        const r = state.round;
        const ids = secret.imposterIds || [];
        const impId = ids[r.guessIndex];
        if (!impId) { finalizeResult(); return ''; }
        const imp = currentPlayerById(impId);
        prepareGuessOptions();
        const options = r.guessOptions?.[impId] || [];
        return `${backRow('فرصة الامبوستر','locked-back')}<div class="card pass-card"><div class="person-orb">🎯</div><h2>${escapeHtml(imp.name)}، اختر الكلمة</h2><p class="lead">قدامك 9 كلمات. إذا اخترت الكلمة الصحيحة تقلب النتيجة لصالح الامبوستر.</p>
          <div class="guess-grid">${options.map(w => `<button class="vote-option" data-guess-option="${escapeHtml(w)}">${escapeHtml(w)}</button>`).join('')}</div>
          <div class="actions two"><button class="btn secondary" data-action="skip-guess">ما عرفت الكلمة</button><button class="btn primary" data-action="submit-guess">ثبت الاختيار</button></div></div>`;
      }

      function submitGuess(value) {
        const r = state.round;
        const impId = secret.imposterIds[r.guessIndex];
        const guess = normalizeName(value);
        if (!guess) { toast('اختر كلمة او اكتب تخمين'); feedback('error'); return; }
        const correct = normalizeArabic(guess) === normalizeArabic(secret.word);
        r.guesses[impId] = { guess, correct };
        if (correct) r.guessedCorrectly = true;
        r.guessIndex++;
        feedback(correct ? 'big' : 'tap');
        if (r.guessIndex >= secret.imposterIds.length || correct) finalizeResult();
        else { saveState(); render(); }
      }

      function applyPoints() {
        const r = state.round;
        if (!state.settings.pointsEnabled || r.pointsApplied) return;
        state.players.forEach(p => {
          const isImp = secret.imposterIds.includes(p.id);
          if (isImp) {
            if (!r.detected) p.score += 2;
            if (r.guesses[p.id]?.correct) p.score += 1;
          } else {
            const selected = r.votes[p.id] || [];
            if (selected.some(id => secret.imposterIds.includes(id))) p.score += 1;
          }
        });
        r.pointsApplied = true;
      }

      function finalizeResult() {
        calculateTally();
        if (state.settings.allImposters) state.round.resultWinner = 'chaos';
        else if (!state.round.detected || state.round.guessedCorrectly) state.round.resultWinner = 'imposters';
        else state.round.resultWinner = 'players';
        applyPoints();
        state.screen = 'result';
        saveState(); render(); launchConfetti();
      }

      function renderResult() {
        const r = state.round;
        if (!r) return '';
        const tally = r.finalTally || {};
        const sorted = [...state.players].sort((a,b) => (tally[b.id]||0)-(tally[a.id]||0));
        const impNames = secret.imposterIds.map(id => currentPlayerById(id)?.name).filter(Boolean);
        const bannerClass = r.resultWinner === 'imposters' ? 'win-imposter' : r.resultWinner === 'chaos' ? 'chaos' : '';
        const title = r.resultWinner === 'players' ? 'اللاعبون كشفوا السالفة 🎉' : r.resultWinner === 'imposters' ? 'الامبوستر قلبها عليكم 😎' : 'جولة فوضوية على اصولها 😂';
        const subtitle = r.resultWinner === 'players' ? 'مسكتم الامبوستر وما قدر يخمن الكلمة.' : r.resultWinner === 'imposters' ? (!r.detected ? 'ما قدرتوا تكشفونه.' : 'انكشف، بس خمن الكلمة صح.') : 'كلكم برا السالفة، وما فيه فائز رسمي.';
        return `${backRow('7 من 7','home')}<div class="result-banner ${bannerClass}"><div style="font-size:42px">🏆</div><h2>${title}</h2><p>${subtitle}</p></div>
          <div class="card"><h3>كشف الحقيقة</h3><p><b>${state.settings.allImposters ? 'الادوار:' : 'الامبوستر:'}</b> ${state.settings.allImposters ? 'الجميع كانوا برا السالفة' : escapeHtml(impNames.join('، '))}</p><p><b>التصنيف:</b> ${escapeHtml(r.categoryName)}</p><p><b>الكلمة المخفية:</b> ${escapeHtml(secret.word)}</p></div>
          <div class="card"><h3>نتيجة التصويت</h3><table class="score-table"><thead><tr><th>اللاعب</th><th>الاصوات</th><th>الدور</th></tr></thead><tbody>${sorted.map(p => `<tr><td>${escapeHtml(p.name)}</td><td>${tally[p.id]||0}</td><td>${secret.imposterIds.includes(p.id) ? '<span class="badge imposter">امبوستر</span>' : '<span class="badge normal">داخل السالفة</span>'}</td></tr>`).join('')}</tbody></table></div>
          ${state.settings.pointsEnabled ? `<div class="card"><h3>ترتيب النقاط</h3><table class="score-table"><thead><tr><th>اللاعب</th><th>النقاط</th></tr></thead><tbody>${[...state.players].sort((a,b)=>b.score-a.score).map((p,i)=>`<tr><td>${i===0?'🥇 ':''}${escapeHtml(p.name)}</td><td><b>${p.score}</b></td></tr>`).join('')}</tbody></table></div>` : ''}
          <div class="actions"><button class="btn primary" data-action="new-same">جولة جديدة بنفس اللاعبين</button><button class="btn secondary" data-action="change-settings">غير الاعدادات</button><button class="btn secondary" data-action="change-players">غير اللاعبين</button><button class="btn ghost" data-action="home">العودة للرئيسية</button></div>`;
      }


      function forbiddenTeamName(teamIndex, source = state.forbidden) {
        const index = clamp(Number(teamIndex || 1), 1, 4) - 1;

        const deck = shuffle(forbiddenCards.map((_, index) => index));
        if (deck.length > 1 && deck[0] === previousIndex) [deck[0], deck[1]] = [deck[1], deck[0]];
        return deck;
      }

      function drawForbiddenCard(round) {
        const previousIndex = round.currentIndex;
        if (!round.deck.length) {
          round.deck = freshForbiddenDeck(previousIndex);
          round.cycle += 1;
        }
        round.currentIndex = round.deck.shift();
        round.tabooHidden = false;
        round.cardsShown += 1;
      }

              </div>

            ${f.mode === 'teams' ? `<div class="setup-section">
              <div class="setup-title"><h3>الفرق</h3><span class="badge">سمّها بطريقتكم</span></div>
              <div class="segmented" style="grid-template-columns:repeat(3,1fr);margin-bottom:12px">${teamButtons}</div>
              <div class="team-name-fields">${f.teamNames.slice(0,f.teams).map((name,i) => `<div class="field"><label for="forbidden-team-name-${i}">اسم الفريق ${i+1}</label><input id="forbidden-team-name-${i}" class="input" maxlength="24" value="${escapeHtml(name)}" data-forbidden-team-name="${i}" placeholder="مثلاً: النشامى"></div>`).join('')}</div>
