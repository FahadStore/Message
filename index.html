            <div class="audio-setting"><div><b>المؤثرات الصوتية</b><div class="hint">صوت الصح، التخطي، المؤقت، ونهاية الجولة.</div></div><label class="switch"><input type="checkbox" data-forbidden-global-sound ${state.settings.sound ? 'checked' : ''}><span class="slider"></span></label></div>
          </div>
        </div>

        <div class="start-panel">
          <div class="start-panel-copy"><b>جاهزين؟</b><span>${f.mode === 'teams' ? `الدور يبدأ مع ${escapeHtml(forbiddenTeamName(f.nextTeam))}` : 'سلّم الجوال للشخص اللي بيشرح أول بطاقة.'}</span></div>
          <button class="btn primary" data-action="start-forbidden">ابدأ الجولة</button>
        </div>`;
      }

      function renderForbiddenPass() {
        const r = state.forbidden.round;
        if (!r) return `<div class="card"><button class="btn primary" data-action="forbidden-home">ارجع لبداية اللعبة</button></div>`;
        const who = r.mode === 'teams' ? `ممثل ${forbiddenTeamName(r.teamIndex)}` : 'اللاعب اللي بيشرح';
        return `${backRow('قبل ما تظهر البطاقة', 'forbidden-home')}<div class="card pass-card">
          <div class="person-orb">🙈</div>
          <h2>عط الجوال لـ ${who}</h2>
          <p class="lead">تأكد إن الشخص الثاني أو باقي الفرق ما يشوفون الشاشة.</p>
          <div class="notice">الجولة ${r.duration} ثانية، ومسموح كلمة وحدة في كل محاولة.</div>
          <button class="btn primary" style="width:100%" data-action="reveal-forbidden">أنا جاهز، اعرض البطاقة</button>
        </div>`;
      }

      function renderForbiddenPlay() {
        const r = state.forbidden.round;
        if (!r?.active || r.currentIndex == null) return `<div class="card"><button class="btn primary" data-action="forbidden-home">ارجع لبداية اللعبة</button></div>`;
        const card = forbiddenCards[r.currentIndex];
        const remaining = Math.max(0, Math.ceil((r.endsAt - Date.now()) / 1000));
        return `${backRow(forbiddenTeamLabel(r), 'forbidden-end-confirm')}<div class="mini-stats">
          <div class="mini-stat"><span class="hint">النقاط</span><strong id="forbidden-score">${r.score}</strong></div>
          <div class="mini-stat"><span class="hint">الوقت</span><strong id="forbidden-time-small">${remaining}</strong></div>
          <div class="mini-stat"><span class="hint">البطاقات</span><strong>${r.cardsShown}</strong></div>
        </div>
        <div class="card forbidden-card">
          <span class="round-note">لفة البطاقات ${r.cycle}</span>
          <div class="forbidden-word">${escapeHtml(card.word)}</div>
          <div class="forbidden-label">ممنوع تقول:</div>
          ${r.tabooHidden
            ? '<div class="forbidden-hidden"><div><div style="font-size:38px">🙈</div><b>الكلمات مخفية</b><div class="hint">اضغط الزر إذا احتجت تشوفها مرة ثانية.</div></div></div>'
            : `<div class="forbidden-words">${card.banned.map(word => `<span>${escapeHtml(word)}</span>`).join('')}</div>`}
          <button class="btn ghost small" style="width:100%;margin-top:12px" data-action="toggle-forbidden-words">${r.tabooHidden ? 'إظهار الكلمات الممنوعة' : 'حفظتها، اخف الكلمات'}</button>
        </div>
        <div id="forbidden-timer" class="timer timer-wide ${remaining <= 10 ? 'ending' : ''}">${remaining}</div>
        <div class="forbidden-controls">
          <button class="btn success" data-action="forbidden-correct">✓ صح</button>
          <button class="btn secondary" data-action="forbidden-skip">↷ تخطي</button>
        </div>
        <button class="btn danger" style="width:100%;margin-top:10px" data-action="forbidden-end">إنهاء الجولة</button>`;
      }

      function renderForbiddenHandoff() {
        const r = state.forbidden.round;
        if (!r) return `<div class="card"><button class="btn primary" data-action="forbidden-home">ارجع لبداية اللعبة</button></div>`;
        const nextTeam = state.forbidden.nextTeam;
        const currentTeamName = forbiddenTeamName(r.teamIndex);
        const nextTeamName = forbiddenTeamName(nextTeam);
        const reasonText = r.endReason === 'correct' ? `${currentTeamName} جابها صح!` : r.endReason === 'timeout' ? `انتهى وقت ${currentTeamName}` : `انتهى دور ${currentTeamName}`;
        return `${backRow('تسليم الدور','forbidden-home')}<div class="card handoff-card">
          <div class="person-orb">🤝</div>
          <span class="stage-kicker">${r.endReason === 'correct' ? '✓ نقطة محسوبة' : '⏱️ انتهى الدور'}</span>
          <h2 style="margin-top:14px">${reasonText}</h2>
          <div class="handoff-arrow">←</div>
          <h3>سلّموا الجوال إلى ${escapeHtml(nextTeamName)}</h3>
          <p class="lead">بعد ما يصير الجوال مع ممثل الفريق التالي اضغطوا تكملة.</p>
          <div class="score-ribbon">${state.forbidden.teamScores.slice(0,r.teams).map((score,i)=>`<span class="${i+1===nextTeam?'active':''}">${escapeHtml(forbiddenTeamName(i+1))}: ${score}</span>`).join('')}</div>
          <div class="actions"><button class="btn primary" data-action="continue-forbidden-team">تكملة مع ${escapeHtml(nextTeamName)}</button><button class="btn secondary" data-action="finish-forbidden-session">إنهاء جلسة الفرق وعرض النتيجة</button><button class="btn ghost" data-action="home">الرجوع لقائمة الألعاب</button></div>
        </div>`;
      }

      function renderForbiddenResult() {
        const r = state.forbidden.round;
        if (!r) return `<div class="card"><button class="btn primary" data-action="forbidden-home">ارجع لبداية اللعبة</button></div>`;
        const isBest = r.score > 0 && r.score === state.forbidden.bestScore;
        const teamRows = r.mode === 'teams' ? `<div class="card"><h3>نتائج الفرق</h3><div class="team-score-list">${state.forbidden.teamScores.slice(0,r.teams).map((score,i) => `<div class="team-score-row ${i+1 === r.teamIndex ? 'active' : ''}"><span>${escapeHtml(forbiddenTeamName(i+1))}</span><b>${score} نقطة</b></div>`).join('')}</div></div>` : '';
        return `${backRow('النتيجة', 'home')}<div class="result-banner">
          <div style="font-size:46px">${isBest ? '🏆' : '👏'}</div>
          <h2>${isBest ? 'رقم قوي!' : 'خلصت الجولة'}</h2>
          <p>${r.mode === 'teams' ? escapeHtml(forbiddenTeamName(r.teamIndex)) : 'نتيجتكم'}: ${r.score} نقطة</p>
        </div>
        <div class="mini-stats">
          <div class="mini-stat"><span class="hint">صح</span><strong>${r.score}</strong></div>
          <div class="mini-stat"><span class="hint">تخطي</span><strong>${r.skipped}</strong></div>
          <div class="mini-stat"><span class="hint">أفضل نتيجة</span><strong>${state.forbidden.bestScore}</strong></div>
        </div>
        ${teamRows}
        <div class="actions">
          <button class="btn primary" data-action="replay-forbidden">إعادة اللعب${r.mode === 'teams' ? ' للفريق التالي' : ''}</button>
          <button class="btn secondary" data-action="forbidden-home">تغيير الإعدادات</button>
          <button class="btn ghost" data-action="home">الرجوع لقائمة الألعاب</button>
        </div>`;
      }

      function beginForbiddenRound() {
        const f = state.forbidden;
        const teamIndex = f.mode === 'teams' ? clamp(Number(f.nextTeam || 1), 1, f.teams) : 1;
        const round = {
          id: makeId(), active: true, finished: false,
          duration: f.duration, mode: f.mode, teams: f.teams, teamIndex,
          score: 0, skipped: 0, cardsShown: 0, cycle: 1,
          deck: freshForbiddenDeck(), currentIndex: null, tabooHidden: false,
          endsAt: null, endReason: null
        };
        drawForbiddenCard(round);
        f.round = round;
        state.screen = 'forbidden-pass';
        history.pushState({gameGuard:true}, '', location.href);
        feedback('big'); saveState(); render();
      }

      function revealForbiddenRound() {
        const r = state.forbidden.round;
        if (!r) return;
        r.endsAt = Date.now() + r.duration * 1000;
        state.screen = 'forbidden-play';
        playGameSound('start');
        saveState(); render();
      }

      function advanceForbiddenCard(correct) {
        const r = state.forbidden.round;
        if (!r?.active) return;
        if (correct) {
          r.score += 1;
          playGameSound('correct');
          if (state.settings.vibration && navigator.vibrate) navigator.vibrate([24,20,30]);
          if (r.mode === 'teams') return finishForbiddenRound('correct');
        } else {
          r.skipped += 1;
          playGameSound('skip');
          if (state.settings.vibration && navigator.vibrate) navigator.vibrate(16);
        }
        drawForbiddenCard(r);
        saveState(); render();
      }

      function finishForbiddenRound(reason = 'manual') {
        const r = state.forbidden.round;
        if (!r?.active) return;
        r.active = false;
        r.finished = true;
        r.endReason = reason;
        r.endsAt = null;
        state.forbidden.bestScore = Math.max(Number(state.forbidden.bestScore || 0), r.score);
        if (r.mode === 'teams') {
          const scores = state.forbidden.teamScores;
          scores[r.teamIndex - 1] = Number(scores[r.teamIndex - 1] || 0) + r.score;
          state.forbidden.nextTeam = (r.teamIndex % r.teams) + 1;
        }
        stopTimer(); stopTensionSound();
        state.screen = r.mode === 'teams' ? 'forbidden-handoff' : 'forbidden-result';
        if (reason === 'timeout') playGameSound('time'); else feedback('big');
        saveState(); render();
        if (r.score > 0) launchConfetti();
      }

      function startForbiddenTimer() {
        const r = state.forbidden.round;
        if (!r?.active || !r.endsAt) return;
        let lastSecond = null;
        const update = () => {
          if (!state.forbidden.round?.active || state.screen !== 'forbidden-play') return stopTimer();
          const remaining = Math.max(0, Math.ceil((r.endsAt - Date.now()) / 1000));
          const timer = document.getElementById('forbidden-timer');
          const small = document.getElementById('forbidden-time-small');
          if (timer) { timer.textContent = remaining; timer.classList.toggle('ending', remaining <= 10); }
          if (small) small.textContent = remaining;
          if (remaining !== lastSecond) {
            lastSecond = remaining;
            if (remaining % 5 === 0) saveState();
          }
          if (remaining <= 0) finishForbiddenRound('timeout');
        };
        update();
        if (state.screen === 'forbidden-play' && r.active) timerHandle = setInterval(update, 250);
      }

      function confirmForbiddenEnd(onYes) {
        showModal({ title:'ننهي جولة الكلمة الممنوعة؟', body:'<p>بتنتقلون للنتيجة الحالية ويتوقف المؤقت.</p>', confirmText:'إنه الجولة', cancelText:'كمل اللعب', onConfirm:()=>{onYes(); return true;} });
      }

      function launchConfetti() {
        const root = document.getElementById('confetti-root');
        root.innerHTML = `<div class="confetti">${Array.from({length:52},(_,i)=>`<i style="left:${Math.random()*100}%;--d:${1.8+Math.random()*2.2}s;--r:${Math.random()*360}deg;--x:${-80+Math.random()*160}px;--h:${Math.random()*360};animation-delay:${Math.random()*.4}s"></i>`).join('')}</div>`;
        setTimeout(() => root.innerHTML = '', 4300);
      }

      function renderPrivacyShield() {
        const root = document.getElementById('privacy-root');
        if (!state.privacyShield) { root.innerHTML = ''; return; }
        root.innerHTML = `<div class="privacy-shield"><div><div class="privacy-icon">🔒</div><h2>غطينا الشاشة</h2><p class="lead">رجعت للتطبيق؟ تاكد ان الجوال مع الشخص الصح.</p><button class="btn primary" data-action="unlock-privacy">رجعت، كمل</button></div></div>`;
        root.querySelector('[data-action="unlock-privacy"]')?.addEventListener('click', () => {
          state.privacyShield = false;
          if (state.screen === 'roles' && state.round) state.round.roleRevealed = false;
          saveState(); render();
        });
      }

      function bindGlobalActions() {
        document.querySelector('[data-action="toggle-theme"]')?.addEventListener('click', () => {
          state.settings.theme = state.settings.theme === 'dark' ? 'light' : 'dark'; feedback(); saveState(); render();
        });
        document.querySelector('[data-action="toggle-sound"]')?.addEventListener('click', () => {
          state.settings.sound = !state.settings.sound; saveState(); render();
        });
      }

      function bindScreenActions() {
        document.querySelectorAll('[data-action]').forEach(btn => btn.addEventListener('click', () => handleAction(btn.dataset.action, btn)));
        document.querySelectorAll('[data-player-input]').forEach(input => {
          input.addEventListener('input', e => {
            const p = currentPlayerById(input.dataset.playerInput); if (p) p.name = e.target.value;
            saveState();
            const next = document.querySelector('[data-action="players-next"]'); if (next) next.disabled = !validPlayers();
          });
          input.addEventListener('blur', () => { const p=currentPlayerById(input.dataset.playerInput); if(p) p.name=normalizeName(p.name); saveState(); render(); });
          input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); if (state.players.length < MAX_PLAYERS) addPlayer(); } });
        });
        document.querySelectorAll('[data-delete-player]').forEach(btn => btn.addEventListener('click', () => {
          if (state.players.length <= MIN_PLAYERS) return toast('اقل شي لاعبين');
          state.players = state.players.filter(p => p.id !== btn.dataset.deletePlayer); feedback(); saveState(); render();
        }));
        document.querySelectorAll('[data-setting]').forEach(input => input.addEventListener('change', () => {
          const key = input.dataset.setting;
          state.settings[key] = input.checked;
          if (key === 'allImposters') { state.settings.imposterCount = 1; state.settings.voteMode = 'one'; }
          feedback(); saveState(); render();
        }));
        document.querySelectorAll('[data-setting-select]').forEach(sel => sel.addEventListener('change', () => {
          const key=sel.dataset.settingSelect; state.settings[key] = key === 'discussionMinutes' ? Number(sel.value) : sel.value; feedback(); saveState(); render();
        }));
        document.querySelectorAll('[data-question-time]').forEach(btn => btn.addEventListener('click', () => { state.settings.questionTimer = Number(btn.dataset.questionTime); feedback(); saveState(); render(); }));
        document.querySelectorAll('[data-category]').forEach(btn => btn.addEventListener('click', () => {
          const id=btn.dataset.category; const set=new Set(state.selectedCategoryIds); set.has(id)?set.delete(id):set.add(id); state.selectedCategoryIds=[...set]; feedback(); saveState(); render();
        }));
        document.querySelectorAll('[data-vote-option]').forEach(btn => btn.addEventListener('click', () => {
          const id=btn.dataset.voteOption; const needed=neededVoteCount(state.round.voterOrder[state.round.voterIndex]);
          const set=new Set(state.round.currentVote); if(set.has(id)) set.delete(id); else { if(set.size>=needed) set.delete([...set][0]); set.add(id); }
          state.round.currentVote=[...set]; feedback(); saveState(); render();
        }));
        document.querySelectorAll('[data-guess-option]').forEach(btn => btn.addEventListener('click', () => {
          document.querySelectorAll('[data-guess-option]').forEach(x=>{x.classList.remove('selected');delete x.dataset.chosen;}); btn.classList.add('selected'); btn.dataset.chosen='1'; feedback();
        }));
        document.querySelectorAll('[data-forbidden-duration]').forEach(btn => btn.addEventListener('click', () => {
          state.forbidden.duration = Number(btn.dataset.forbiddenDuration); feedback(); saveState(); render();
        }));
        document.querySelectorAll('[data-forbidden-teams]').forEach(btn => btn.addEventListener('click', () => {
          state.forbidden.teams = Number(btn.dataset.forbiddenTeams);
          state.forbidden.nextTeam = clamp(state.forbidden.nextTeam, 1, state.forbidden.teams);
          feedback(); saveState(); render();
        }));
        document.querySelectorAll('[data-forbidden-team-name]').forEach(input => {
          input.addEventListener('input', () => {
            const index = Number(input.dataset.forbiddenTeamName);
            state.forbidden.teamNames[index] = input.value;
            saveState();
          });
          input.addEventListener('blur', () => {
            const index = Number(input.dataset.forbiddenTeamName);
            state.forbidden.teamNames[index] = normalizeName(input.value) || `فريق ${index + 1}`;
            saveState(); render();
          });
          input.addEventListener('keydown', event => {
            if (event.key === 'Enter') { event.preventDefault(); input.blur(); }
          });
        });
        document.querySelectorAll('[data-forbidden-mode]').forEach(btn => btn.addEventListener('click', () => {
          state.forbidden.mode = btn.dataset.forbiddenMode;
          feedback(); saveState(); render();
        }));
        document.querySelectorAll('[data-forbidden-select]').forEach(sel => sel.addEventListener('change', () => {
          state.forbidden[sel.dataset.forbiddenSelect] = sel.value; feedback(); saveState(); render();
        }));
        document.querySelectorAll('[data-forbidden-setting]').forEach(input => input.addEventListener('change', () => {
          state.forbidden[input.dataset.forbiddenSetting] = input.checked; feedback(); saveState(); render();
        }));
        document.querySelector('[data-forbidden-global-sound]')?.addEventListener('change', e => {
          state.settings.sound = e.target.checked; saveState(); render();
        });
      }

      function addPlayer() {
        if (state.players.length >= MAX_PLAYERS) return toast('وصلتم للحد الاقصى من اللاعبين');
        state.players.push({ id: makeId(), name: `اللاعب ${state.players.length+1}`, score: 0 });
        feedback(); saveState(); render();
        setTimeout(() => document.querySelectorAll('[data-player-input]')[state.players.length-1]?.focus(), 0);
      }

      function handleAction(action, btn) {
        switch(action) {
          case 'open-imposter': state.screen='imposter-home'; feedback(); saveState(); render(); break;
          case 'open-forbidden': state.screen='forbidden-home'; feedback(); saveState(); render(); break;
          case 'imposter-home': state.screen='imposter-home'; saveState(); render(); break;
          case 'start-game':
          case 'start-imposter': state.round=null; secret={}; state.screen='players'; feedback('big'); saveState(); render(); break;
          case 'resume-game': state.screen = state.round?.allRolesSeen ? 'questions' : 'roles'; render(); break;
          case 'home':
            if (state.forbidden.round?.active && state.screen === 'forbidden-play') return confirmForbiddenEnd(() => { state.forbidden.round=null; state.screen='home'; saveState(); render(); });
            if (state.round?.started && !['result','imposter-home'].includes(state.screen)) return confirmEnd(() => { state.screen='home'; state.round=null; secret={}; saveState(); render(); });
            if (state.screen === 'result') { state.round=null; secret={}; }
            if (state.screen === 'forbidden-result') state.forbidden.round=null;
            state.screen='home'; saveState(); render(); break;
          case 'back': if (state.screen==='settings') state.screen='players'; else if(state.screen==='categories') state.screen='settings'; saveState(); render(); break;
          case 'locked-back': confirmEnd(() => { state.round=null; secret={}; state.screen='categories'; saveState(); render(); }); break;
          case 'add-player': addPlayer(); break;
          case 'temp-names': state.players.forEach((p,i)=>p.name=`لاعب ${i+1}`); feedback(); saveState(); render(); break;
          case 'players-next':
            state.players.forEach(p=>p.name=normalizeName(p.name));
            if(!validPlayers()) { feedback('error'); toast(playerErrors()||'تاكد من الاسامي'); return; }
            state.settings.imposterCount=clamp(state.settings.imposterCount,1,maxImposters()); state.screen='settings'; feedback(); saveState(); render(); break;
          case 'imp-minus': state.settings.imposterCount=clamp(state.settings.imposterCount-1,1,maxImposters()); feedback(); saveState(); render(); break;
          case 'imp-plus': state.settings.imposterCount=clamp(state.settings.imposterCount+1,1,maxImposters()); feedback(); saveState(); render(); break;
          case 'reset-scores': showModal({title:'نصفر النقاط؟',body:'<p>كل نقاط الجلسة بتنمسح.</p>',confirmText:'ايه، صفرها',onConfirm:()=>{state.players.forEach(p=>p.score=0);feedback('big');saveState();render();}}); break;
          case 'settings-next':
            if(!state.selectedCategoryIds.length) state.selectedCategoryIds=[sample(allCategories()).id]; state.screen='categories'; feedback(); saveState(); render(); break;
          case 'custom-category': openCustomCategory(); break;
          case 'start-roles': startRound(); break;
          case 'go-categories': state.screen='categories'; render(); break;
          case 'reveal-role': state.round.roleRevealed=true; feedback('big'); saveState(); render(); break;
          case 'hide-role':
            state.round.roleRevealed=false; state.round.roleIndex++;
            if(state.round.roleIndex>=state.round.distributionOrder.length) state.round.allRolesSeen=true;
            feedback(); saveState(); render(); break;
          case 'begin-questions': beginQuestions(false); break;
          case 'next-question':
            const pair=state.round.pairings[state.round.questionIndex]; state.round.usedPairs.push(`${pair.asker}>${pair.target}`); state.round.questionIndex++;
            if(state.round.questionIndex>=state.round.pairings.length) state.round.questionPhase='complete'; feedback(); saveState(); render(); break;
          case 'skip-match': skipCurrentMatch(); break;
          case 'extra-questions': beginQuestions(true); break;
          case 'start-discussion': startDiscussion(); break;
          case 'toggle-discussion': state.round.discussionRunning=!state.round.discussionRunning; feedback(); saveState(); render(); break;
          case 'go-voting': goVoting(); break;
          case 'start-vote': state.round.voteStarted=true; state.round.currentVote=[]; feedback(); saveState(); render(); break;
          case 'confirm-vote':
            const voterId=state.round.voterOrder[state.round.voterIndex]; state.round.votes[voterId]=[...state.round.currentVote]; state.round.voterIndex++; state.round.voteStarted=false; state.round.currentVote=[]; playGameSound('vote'); feedback('big');
            if(state.round.voterIndex>=state.round.voterOrder.length) finishVoting(); else {saveState();render();} break;
          case 'finish-voting': finishVoting(); break;
          case 'continue-to-guess': state.screen='guess'; feedback('big'); saveState(); render(); break;
          case 'submit-guess':
            const chosen=document.querySelector('[data-guess-option][data-chosen="1"]')?.textContent?.trim(); submitGuess(chosen||''); break;
          case 'skip-guess': submitGuess('ما ادري'); break;
          case 'new-same': state.round=null; secret={}; startRound(); break;
          case 'change-settings': state.round=null; secret={}; state.screen='settings'; saveState(); render(); break;
          case 'change-players': state.round=null; secret={}; state.screen='players'; saveState(); render(); break;
          case 'start-forbidden': beginForbiddenRound(); break;
          case 'reveal-forbidden': revealForbiddenRound(); break;
          case 'forbidden-correct': advanceForbiddenCard(true); break;
          case 'forbidden-skip': advanceForbiddenCard(false); break;
          case 'toggle-forbidden-words': state.forbidden.round.tabooHidden=!state.forbidden.round.tabooHidden; feedback(); saveState(); render(); break;
          case 'forbidden-end': finishForbiddenRound('manual'); break;
          case 'forbidden-end-confirm': confirmForbiddenEnd(()=>finishForbiddenRound('manual')); break;
          case 'forbidden-home':
            if (state.forbidden.round?.active && state.screen === 'forbidden-play') return confirmForbiddenEnd(()=>{state.forbidden.round=null;state.screen='forbidden-home';saveState();render();});
            state.forbidden.round=null; state.screen='forbidden-home'; saveState(); render(); break;
          case 'replay-forbidden': beginForbiddenRound(); break;
          case 'continue-forbidden-team': beginForbiddenRound(); break;
          case 'finish-forbidden-session': state.screen='forbidden-result'; feedback('big'); saveState(); render(); break;
          case 'reset-forbidden-teams': state.forbidden.teamScores=[0,0,0,0]; state.forbidden.nextTeam=1; feedback('big'); saveState(); render(); break;
          case 'how-to': openHowTo(); break;
          case 'share': shareGame(); break;
          case 'install': installApp(); break;
        }
      }

      function confirmEnd(onYes) {
        showModal({ title:'متاكد تبي تنهي الجولة؟', body:'<p>اذا رجعت الحين بتروح بيانات الجولة الحالية، لكن النقاط تبقى.</p>', confirmText:'ايه، انه الجولة', cancelText:'لا، كمل', onConfirm:()=>{onYes(); return true;} });
      }
      function openHowTo() {
        showModal({ title:'كيف تلعبون؟', hideCancel:true, body:`<div class="soft-card"><b>1.</b> ضيفوا اللاعبين وحددوا عدد الامبوسترات.</div><div class="soft-card"><b>2.</b> كل لاعب يشوف دوره بسرية. العادي يعرف الكلمة، والامبوستر ما يعرفها.</div><div class="soft-card"><b>3.</b> اسالوا بعض اسئلة ذكية بدون ما تكشفون الكلمة.</div><div class="soft-card"><b>4.</b> صوتوا على اللي تشكون انه برا السالفة.</div><div class="soft-card"><b>5.</b> اذا انكشف الامبوستر، يقدر يفوز لو خمن الكلمة.</div>` });
      }
      function openCustomCategory() {
        showModal({ title:'اضف تصنيفك', confirmText:'اضافة', body:`<div class="field"><label>اسم التصنيف</label><input id="custom-name" class="input" maxlength="30" placeholder="مثلا: اشياء بالدوام"></div><div class="field"><label>الكلمات</label><textarea id="custom-words" placeholder="كل كلمة بسطر، او افصل بينها بفاصلة"></textarea><div class="hint">اقل شي 5 كلمات مختلفة.</div></div>`, onConfirm:(root)=>{
          const name=normalizeName(root.querySelector('#custom-name').value); const raw=root.querySelector('#custom-words').value;
          const words=[...new Set(raw.split(/[،,\n]+/).map(normalizeName).filter(Boolean))];
          if(!name){toast('اكتب اسم التصنيف');return false;} if(words.length<5){toast('حط 5 كلمات على الاقل');return false;}
          const id=`custom_${makeId()}`; state.customCategories.push({id,name,icon:'✨',words}); state.selectedCategoryIds.push(id); feedback('big'); saveState(); render(); return true;
        }});
      }
      async function shareGame() {
        const data={title:'جلسة ألعاب',text:'يلا نلعب ألعاب الجلسات؟',url:location.href};
        try { if(navigator.share) await navigator.share(data); else { await navigator.clipboard.writeText(location.href); toast('نسخنا رابط اللعبة'); } } catch {}
      }
      async function installApp() {
        if(!deferredInstallPrompt){toast('خيار التثبيت يطلع بعد رفع الملف على استضافة تدعم PWA');return;}
        deferredInstallPrompt.prompt(); await deferredInstallPrompt.userChoice; deferredInstallPrompt=null; render();
      }

      window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstallPrompt=e; render(); });
      document.addEventListener('visibilitychange', () => {
        if(document.hidden && state.screen==='roles' && state.round?.roleRevealed){ state.privacyShield=true; state.round.roleRevealed=false; saveState(); }
      });
      window.addEventListener('blur', () => {
        if(state.screen==='roles' && state.round?.roleRevealed){ state.privacyShield=true; state.round.roleRevealed=false; saveState(); renderPrivacyShield(); }
      });
      window.addEventListener('orientationchange', () => {
        if(state.screen==='roles' && state.round?.roleRevealed){ state.privacyShield=true; state.round.roleRevealed=false; saveState(); renderPrivacyShield(); }
      });
      window.addEventListener('keydown', e => {
        if(e.key==='Escape' && document.getElementById('modal-root').innerHTML) document.getElementById('modal-root').innerHTML='';
      });
      if ((state.round?.started && state.screen !== 'result') || (state.forbidden.round?.active && state.screen === 'forbidden-play')) history.pushState({gameGuard:true}, '', location.href);
      window.addEventListener('popstate', () => {
        if (state.forbidden.round?.active && state.screen === 'forbidden-play') {
          history.pushState({gameGuard:true}, '', location.href);
          confirmForbiddenEnd(() => { state.forbidden.round=null; state.screen='forbidden-home'; saveState(); render(); });
        } else if (state.round?.started && state.screen !== 'result') {
          history.pushState({gameGuard:true}, '', location.href);
          confirmEnd(() => { state.round=null; secret={}; state.screen='categories'; saveState(); render(); });
        }
      });

      render();
    })();
  </script>
</body>
</html>
